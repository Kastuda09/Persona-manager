<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Post</title>
    
<style>
    :root {
        --bg: #0b0d12;
        --panel: #151822;
        --panel-2: #1c202c;
        --border: #262b3a;
        --text: #f2f3f7;
        --muted: #9096a8;
        --accent: #6d8bff;
        --accent-2: #8f6dff;
        --good: #3ddc84;
        --bad: #ff5c7a;
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 640px;
        margin: 0 auto;
        padding: 32px 20px 80px;
        background: radial-gradient(circle at top, #131622 0%, #0b0d12 55%);
        color: var(--text);
        line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    .top-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 0.2px;
    }
    .brand .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 14px rgba(109,139,255,0.7);
    }
    .back-link {
        font-size: 14px;
        color: var(--muted);
    }
    h1 {
        font-size: 26px;
        margin: 0 0 6px;
        letter-spacing: -0.3px;
    }
    .subtitle {
        color: var(--muted);
        font-size: 15px;
        margin: 0 0 28px;
    }
    .card {
        background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 18px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    }
    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }
    input[type="text"], select, textarea {
        width: 100%;
        padding: 13px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #10121a;
        color: var(--text);
        font-size: 15px;
        transition: border-color 0.15s ease;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--accent);
    }
    input[type="file"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px dashed var(--border);
        background: #10121a;
        color: var(--muted);
        font-size: 14px;
    }
    button, .btn {
        display: inline-block;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        font-size: 15px;
        padding: 13px 22px;
        border-radius: 12px;
        border: none;
        transition: transform 0.1s ease, opacity 0.15s ease;
    }
    button:hover, .btn:hover { opacity: 0.92; }
    button:active, .btn:active { transform: scale(0.98); }
    .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        text-decoration: none;
    }
    .btn-secondary {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        text-decoration: none;
    }
    .btn-approve { background: var(--good); color: #06210f; }
    .btn-reject { background: var(--bad); color: #2b0710; }
    .badge {
        background: var(--bad);
        color: white;
        border-radius: 20px;
        padding: 2px 10px;
        font-size: 13px;
        margin-left: 6px;
        font-weight: 600;
    }
    .pill {
        display: inline-block;
        background: rgba(109,139,255,0.12);
        color: var(--accent);
        border: 1px solid rgba(109,139,255,0.3);
        border-radius: 20px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 600;
        margin-right: 6px;
    }
    .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
        margin-top: 12px;
    }
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 14px; }
</style>

    <style>
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 4px;
        }
        .mode-option {
            flex: 1;
            text-align: center;
            padding: 14px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #10121a;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
        }
        .mode-option.active {
            border-color: var(--accent);
            color: var(--text);
            background: rgba(109,139,255,0.1);
        }
        .preview-wrap {
            margin-top: 12px;
            display: none;
        }
        .preview-wrap img, .preview-wrap video {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-height: 320px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="brand"><span class="dot"></span> Persona Manager</div>
        <a class="back-link" href="/">&larr; Back</a>
    </div>

    <h1>Create a New Post</h1>
    <p class="subtitle">Tell your manager what happened, or hand it a story idea to run with.</p>

    <form method="POST" enctype="multipart/form-data">
        <div class="card">
            <div class="mode-toggle">
                <div class="mode-option active" id="tab-real" onclick="setMode('real')">Real Moment</div>
                <div class="mode-option" id="tab-fictional" onclick="setMode('fictional')">Fictional Story</div>
            </div>
            <input type="hidden" name="mode" id="mode" value="real">

            <div id="real-fields">
                <label>Upload photo or video</label>
                <input type="file" name="media_file" id="media_file" accept="image/*,video/*" onchange="previewFile(this)">
                <div class="preview-wrap" id="preview-wrap">
                    <img id="preview-img" style="display:none;">
                    <video id="preview-video" style="display:none;" controls></video>
                </div>
            </div>

            <div id="fictional-fields" style="display:none;">
                <label>Character name</label>
                <input type="text" name="character_name" placeholder="e.g. Finn the Fox">
                <label>Audience</label>
                <input type="text" name="audience" placeholder="e.g. children, general, adults">
            </div>

            <label>Describe what happened, or your story idea</label>
            <textarea name="description" rows="4" placeholder="Tell your manager what this post is about..."></textarea>
        </div>

        <button type="submit" class="btn-primary" style="width:100%;">Send to My Manager</button>
    </form>

    <script>
        function setMode(mode) {
            document.getElementById('mode').value = mode;
            document.getElementById('tab-real').classList.toggle('active', mode === 'real');
            document.getElementById('tab-fictional').classList.toggle('active', mode === 'fictional');
            document.getElementById('real-fields').style.display = mode === 'real' ? 'block' : 'none';
            document.getElementById('fictional-fields').style.display = mode === 'fictional' ? 'block' : 'none';
        }

        function previewFile(input) {
            var wrap = document.getElementById('preview-wrap');
            var img = document.getElementById('preview-img');
            var video = document.getElementById('preview-video');
            if (!input.files || !input.files[0]) {
                wrap.style.display = 'none';
                return;
            }
            var file = input.files[0];
            var url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                video.src = url;
                video.style.display = 'block';
                img.style.display = 'none';
            } else {
                img.src = url;
                img.style.display = 'block';
                video.style.display = 'none';
            }
            wrap.style.display = 'block';
        }
    </script>
</body>
</html>
