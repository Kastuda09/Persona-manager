<!DOCTYPE html>
<html>
<head>
    <title>Persona Manager</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; background: #0f1115; color: #eee; }
        h1 { font-size: 28px; }
        a.button { display: inline-block; background: #4f7cff; color: white; padding: 14px 22px; border-radius: 10px; text-decoration: none; margin: 8px 8px 8px 0; font-size: 16px; }
        .badge { background: #ff5c5c; color: white; border-radius: 20px; padding: 2px 10px; font-size: 14px; margin-left: 8px; }
    </style>
</head>
<body>
    <h1>Your AI Content Manager</h1>
    <p>Create a new post idea, and your manager will draft it in your own voice, ready for your approval.</p>
    <a class="button" href="/create">Create New Post</a>
    <a class="button" href="/queue">Approval Queue
        {% if pending_count > 0 %}<span class="badge">{{ pending_count }}</span>{% endif %}
    </a>
    <a class="button" href="/history">History</a>
</body>
</html>
